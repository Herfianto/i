<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ily</title>
    <link rel="stylesheet" href="style.css">
</head>
    <style>
        * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #f6efe9;
  color: #3b2f2f;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

.quiz-container {
  width: 100%;
  max-width: 400px;
  padding: 28px;
  background: #fffaf6;
  border: 1px solid #e6d8cc;
  border-radius: 12px;
}

h2 {
  margin: 0 0 16px;
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.3;
}

textarea {
  display: block;
  width: 100%;
  height: 100px;
  padding: 10px 12px;
  border: 1px solid #d8c7b8;
  border-radius: 8px;
  background: #fff;
  color: inherit;
  font: inherit;
  resize: none;
}

textarea:focus {
  outline: none;
  border-color: #c4526a;
}

button {
  margin-top: 12px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #c4526a;
  color: #fff;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}

button:hover {
  background: #a8435a;
}

button:active {
  transform: translateY(1px);
}

#hasil {
  min-height: 1.5em;
  margin: 16px 0 0;
  font-size: 1.1rem;
  font-weight: 600;
}

#hasil.pop {
  animation: muncul 0.3s ease-out;
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
    </style>
<body>

    <div class="quiz-container">
        <h2>kamu bosen sama aku gaa?</h2>

        <textarea id="jawaban"></textarea>

        <button onclick="cekJawaban()">Kirim Jawaban</button>

        <p id="hasil"></p>
    </div>

    <script>
        function cekJawaban() {
            let jawaban = document.getElementById("jawaban").value.toLowerCase().trim();
            let hasil = document.getElementById("hasil");
            hasil.classList.remove("pop");
void hasil.offsetWidth;
hasil.classList.add("pop");

            let kataCinta = [
                "enga",
                "ga",
                "sayang",
                "cinta",
                "kasih",
                "i love you"
            ];

            let benar = kataCinta.some(kata => jawaban.includes(kata));

            if (benar) {
                hasil.innerHTML = "I LOVEEEEE YOUUUUUUUU ";
            } else {
                hasil.innerHTML = "hwhwhwhwhhhwhwhwhwhwhw🥺🥺🥺🥺🥺🥺🥺🥺";
            }
        }
    </script>

</body>
</html>
