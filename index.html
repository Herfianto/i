<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ily</title>
    <link rel="stylesheet" href="style.css">
</head>
    <style>
    * { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Poppins", system-ui, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 300% 300%;
  animation: bg 12s ease infinite;
  padding: 16px;
}
@keyframes bg {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.quiz-container {
  width: min(92vw, 420px);
  padding: 28px 24px;
  text-align: center;
  color: #fff;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(120, 40, 100, 0.25);
  animation: masuk 0.8s ease both;
}
@keyframes masuk {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
}

h2 { margin: 0 0 16px; text-shadow: 0 2px 8px rgba(0,0,0,.15); }

textarea {
  width: 100%;
  height: 110px;
  padding: 12px;
  border: 2px solid transparent;
  border-radius: 14px;
  outline: none;
  resize: none;
  font: inherit;
  transition: border-color .3s, box-shadow .3s;
}
textarea:focus {
  border-color: #ff5c8a;
  box-shadow: 0 0 0 4px rgba(255, 92, 138, 0.3);
}

button {
  margin-top: 14px;
  padding: 12px 28px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  font: 600 1rem inherit;
  background: linear-gradient(45deg, #ff5c8a, #ff8a5c);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  animation: detak 1.6s infinite;
}
button:hover { transform: scale(1.06); box-shadow: 0 8px 20px rgba(255, 92, 138, .5); }
button:active { transform: scale(.96); }
@keyframes detak {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 92, 138, .6); }
  50% { box-shadow: 0 0 0 12px rgba(255, 92, 138, 0); 
#hasil {
  margin-top: 18px;
  font-size: 1.3rem;
  font-weight: 700;
  min-height: 1.5em;
}
#hasil.pop { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop {
  from { opacity: 0; transform: scale(.3) rotate(-8deg); }
}

body::before {
  content: "❤️❤️❤️❤️❤️❤️";
  position: fixed;
  bottom: -40px;
  left: 0;
  width: 100%;
  font-size: 2rem;
  letter-spacing: 40px;
  text-align: center;
  white-space: nowrap;
  animation: naik 8s linear infinite;
  pointer-events: none;
}
@keyframes naik {
  to { transform: translateY(-110vh); opacity: 0; }
    </style>
}
<body>

    <div class="quiz-container">
        <h2>kamu bosen sama aku gaa?</h2>

        <textarea id="jawaban"></textarea>

        <button onclick="cekJawaban()">Kirim Jawaban</button>

        <p id="hasil"></p>
    </div>

    <script>
        function cekJawaban() {
            let jawaban = document.getElementById("jawaban").value.toLowerCase().trim();
            let hasil = document.getElementById("hasil");
            hasil.classList.remove("pop");
void hasil.offsetWidth;
hasil.classList.add("pop");

            let kataCinta = [
                "enga",
                "ga",
                "sayang",
                "cinta",
                "kasih",
                "i love you"
            ];

            let benar = kataCinta.some(kata => jawaban.includes(kata));

            if (benar) {
                hasil.innerHTML = "I LOVEEEEE YOUUUUUUUU ";
            } else {
                hasil.innerHTML = "hwhwhwhwhhhwhwhwhwhwhw🥺🥺🥺🥺🥺🥺🥺🥺";
            }
        }
    </script>

</body>
</html>
