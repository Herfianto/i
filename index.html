<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ily</title>
    <style>
        * {
            box-sizing: border-box;
            border-radius: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #0f0f12;
            background-image: repeating-linear-gradient(
                135deg,
                transparent 0 14px,
                rgba(255, 255, 255, 0.03) 14px 15px
            );
            color: #f4ede4;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        .quiz-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 32px 28px 28px;
            background: #1a1a20;
            border: 2px solid #f4ede4;
            box-shadow: 10px 10px 0 #ff3d68;
            animation: masuk 0.5s ease-out;
        }

        .quiz-container::before {
            content: "";
            position: absolute;
            top: -2px;
            right: -2px;
            width: 28px;
            height: 28px;
            background: #ff3d68;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        h2 {
            margin: 0 0 20px;
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        textarea {
            display: block;
            width: 100%;
            height: 110px;
            padding: 12px 14px;
            background: #0f0f12;
            border: 2px solid #f4ede4;
            color: inherit;
            font: inherit;
            resize: none;
            transition: box-shadow 0.15s, transform 0.15s;
        }

        textarea:focus {
            outline: none;
            border-color: #ff3d68;
            box-shadow: 5px 5px 0 #ff3d68;
            transform: translate(-3px, -3px);
        }

        button {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 14px 20px;
            background: #f4ede4;
            border: 2px solid #f4ede4;
            box-shadow: 5px 5px 0 #ff3d68;
            color: #0f0f12;
            font: inherit;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 #ff3d68;
        }

        button:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 #ff3d68;
        }

        #hasil {
            min-height: 1.5em;
            margin: 22px 0 0;
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1.3;
            color: #ff3d68;
            word-break: break-word;
        }

        #hasil.pop {
            animation: hentak 0.35s steps(6, end);
        }

        @keyframes masuk {
            from {
                opacity: 0;
                transform: translate(-12px, 12px);
            }
        }

        @keyframes hentak {
            0% {
                opacity: 0;
                transform: translateX(-16px) skewX(-12deg);
            }
            100% {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h2>kamu bosen sama aku gaa?</h2>
        <textarea id="jawaban"></textarea>
        <button onclick="cekJawaban()">Kirim Jawaban</button>
        <p id="hasil"></p>
    </div>

    <script>
        const kataCinta = ["enga", "ga", "sayang", "cinta", "kasih", "i love you"];

        function cekJawaban() {
            const jawaban = document.getElementById("jawaban").value.toLowerCase().trim();
            const hasil = document.getElementById("hasil");

            const benar = kataCinta.some(kata => jawaban.includes(kata));

            hasil.textContent = benar
                ? "I LOVEEEEE YOUUUUUUUU 😘😘😘😘😘"
                : "hwhwhwhwhhhwhwhwhwhwhw🥺🥺🥺🥺🥺🥺🥺🥺";

            hasil.classList.remove("pop");
            void hasil.offsetWidth;
            hasil.classList.add("pop");
        }
    </script>
</body>
</html>
